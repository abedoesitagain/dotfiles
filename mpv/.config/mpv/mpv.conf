# [Volume]
volume-max=100
volume=100

# [OSD/OSC]
no-osc
no-osd-bar
osd-font-size=40
osd-font="Fira Code"
osd-border-color="#ffffff"
osd-color="#000000"
osd-border-size=1
#backgroud-color="#000000" # managed by darkman

# [Subtitles]
sub-font-size=50
sub-font='Playfair Display'
#sub-font='OPTITimes-Roman Regular'
sub-border-size=2
sub-auto="fuzzy"
ytdl-raw-options=sub-lang="en,ar,fr,de",write-sub=,write-auto-sub=
sub-ass-override

# [Screenshots]
screenshot-directory=~/pics/screenshots/mpv/
screenshot-format=jpg

input-ipc-server=/tmp/mpv-socket

#correct-pts=yes

alang=jp,jpn,en,eng
slang=en,eng,ar,ara

ytdl-format=bestvideo[height<=?1080]+bestaudio/best
#ytdl-format=bestvideo[height<=?360]+bestaudio/best
#[fps<=?60]
[fps<=?30]
#[vcodec!=vp9]

#hwdec=auto
#dither-depth=8
#scale-antiring=0.6
#gpu-api=vulkan
sub-file-paths = zzz_subtitles:sub:subtitles:subs:Subs
