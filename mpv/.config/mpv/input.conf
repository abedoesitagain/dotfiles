# disable all volume control
WHEEL_UP	ignore
WHEEL_DOWN	ignore
WHEEL_LEFT	ignore
WHEEL_RIGHT	ignore

UP		ignore
DOWN		ignore
k		add volume 5
j		add volume -5
k		ignore
j		ignore
#space   ignore
#p       ignore
#
q       quit-watch-later

# seeking
#MBTN_LEFT		seek -5
#MBTN_RIGHT		seek 5
h		seek -5
l		seek +5
H		seek -10
L		seek +10
ctrl+h		seek -30
ctrl+l		seek +30

# playlist items
K		playlist-prev
J		playlist-next

# chapters
ctrl+k		add chapter -1
ctrl+j		add chapter 1

# contrast
b		add contrast -1
B		add contrast 1
ctrl+b		set contrast 0

# saturation
n		add saturation -1
N		add saturation 1
ctrl+n		set saturation 0

# subtitles
c		cycle sub
C		cycle sub down
ctrl+c		cycle sub-visibility

# audio
ctrl+w		cycle aid

# loop file
R		cycle-values loop-file "inf" "no"

# panscan
P		cycle-values panscan 1.0 0

# mdmenus
`		script-binding mdmenu/tracklist
~		script-binding mdmenu/chapters
e		script-binding mdmenu/playlist

# blur
r		ignore

Y       cycle-values background-color "#181818" "#fbf1c7" "#000000"

#t       script-binding toggle-blur

# ignored keys
1 		ignore
2 		ignore
3 		ignore
4 		ignore
5 		ignore
